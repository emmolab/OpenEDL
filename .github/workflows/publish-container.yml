name: Publish container image

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Git release tag to publish (for example v1.4.0)
        required: true
        type: string
      publish_latest:
        description: Also move the latest tag to this image
        required: true
        default: false
        type: boolean

concurrency:
  group: container-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Resolve release tags
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
          MANUAL_LATEST: ${{ inputs.publish_latest || false }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must look like v1.4 or v1.4.0."
            exit 1
          fi
          if ! git tag --points-at HEAD --list "$RELEASE_TAG" | grep --fixed-strings --line-regexp "$RELEASE_TAG" >/dev/null; then
            echo "::error::$RELEASE_TAG is not a Git tag on the checked-out commit."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          major="${version%%.*}"
          minor_rest="${version#*.}"
          minor_component="${minor_rest%%.*}"
          minor="$major.$minor_component"
          stable=true
          if [[ "$version" == *-* ]]; then
            stable=false
          fi
          publish_latest=false
          if [[ "$EVENT_NAME" == "release" && "$RELEASE_PRERELEASE" != "true" ]]; then
            publish_latest=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_LATEST" == "true" ]]; then
            publish_latest=true
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$publish_latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build smoke-test image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: openedl:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          container_id="$(docker run --detach \
            --env AUTH_BASE_URL=http://127.0.0.1:3000 \
            --env CRON_SECRET=smoke-test-secret \
            openedl:smoke-test)"
          cleanup() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..20}; do
            status="$(docker inspect \
              --format='{{.State.Health.Status}}' "$container_id")"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 3
          done

          docker logs "$container_id"
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.minor }},enable=${{ steps.release.outputs.stable == 'true' }}
            type=raw,value=${{ steps.release.outputs.major }},enable=${{ steps.release.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.publish_latest == 'true' }}

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Attest published image
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
